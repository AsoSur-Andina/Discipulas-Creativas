<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel de seguimiento · Ministerio de la Mujer ASA</title>
<link rel="icon" href="../assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/admin.css" />
</head>
<body>

<header class="site-header">
  <div class="brand">
    <img src="../assets/img/logo.png" alt="Logo Ministerio de la Mujer" class="logo" />
    <div class="brand-text">
      <h1>Ministerio de la Mujer ASA</h1>
      <span>Panel de seguimiento · Discípulas Creativas</span>
    </div>
  </div>
  <div class="header-user">
    <span id="admin-email"></span>
    <button class="btn btn-secondary btn-small" id="btn-logout" type="button">Cerrar sesión</button>
  </div>
</header>

<main class="container">

  <div id="cargando" class="loading-screen">
    <span class="spinner"></span> Verificando acceso…
  </div>

  <div id="panel-contenido" class="hidden">

    <div class="admin-topbar">
      <h2 style="margin:0;">Seguimiento de metas</h2>
      <button class="btn btn-secondary btn-small" id="btn-exportar" type="button">⬇ Exportar CSV</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="valor" id="stat-total">0</div>
        <div class="etiqueta">Damas registradas</div>
      </div>
      <div class="stat-card">
        <div class="valor" id="stat-completas">0</div>
        <div class="etiqueta">Cumplieron la meta</div>
      </div>
      <div class="stat-card">
        <div class="valor" id="stat-progreso">0</div>
        <div class="etiqueta">En camino</div>
      </div>
      <div class="stat-card">
        <div class="valor" id="stat-sin-empezar">0</div>
        <div class="etiqueta">Sin empezar</div>
      </div>
    </div>

    <div class="filtros-bar">
      <input type="text" id="filtro-busqueda" placeholder="Buscar por nombre o iglesia…" style="min-width:220px;" />
      <select id="filtro-distrito">
        <option value="">Todos los distritos</option>
      </select>
      <select id="filtro-estado">
        <option value="">Todos los estados</option>
        <option value="completo">🏅 Cumplió la meta</option>
        <option value="progreso">En camino</option>
        <option value="sin-empezar">Sin empezar</option>
      </select>
      <div class="spacer"></div>
    </div>

    <div class="tabla-wrap">
      <table class="tabla-damas">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Distrito</th>
            <th>Iglesia</th>
            <th>Avance</th>
            <th>Última actividad</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="tabla-body"></tbody>
      </table>
    </div>

  </div>

</main>

<div class="detalle-panel hidden" id="detalle-panel">
  <div class="detalle-card" id="detalle-cuerpo"></div>
</div>

<footer class="site-footer">
  Ministerio de la Mujer · Asociación Sur Andina (ASA)
</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-distritos.js"></script>
<script src="../js/modulos-data.js"></script>
<script src="../js/admin-panel.js"></script>
</body>
</html>
