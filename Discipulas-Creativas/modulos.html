<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mis módulos · Ministerio de la Mujer ASA</title>
<link rel="icon" href="assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="brand">
    <img src="assets/img/logo.png" alt="Logo Ministerio de la Mujer" class="logo" />
    <div class="brand-text">
      <h1>Ministerio de la Mujer ASA</h1>
      <span>Discípulas Creativas</span>
    </div>
  </div>
  <div class="header-user">
    <span>Hola, <strong id="header-nombre">…</strong></span>
    <button class="btn btn-secondary btn-small" id="btn-salir" type="button">Salir</button>
  </div>
</header>

<main class="container">

  <div id="cargando" class="loading-screen">
    <span class="spinner"></span> Cargando tu progreso…
  </div>

  <section class="progreso-wrap hidden" id="progreso-seccion">
    <div class="progreso-top">
      <div>
        <h2>Tu camino</h2>
        <p style="margin:0; color:var(--texto-suave); font-size:0.9rem;" id="dama-distrito-iglesia"></p>
      </div>
      <span class="progreso-badge" id="progreso-texto"></span>
    </div>
    <div class="progreso-barra">
      <div class="relleno" id="progreso-relleno" style="width:0%;"></div>
    </div>
    <div class="completado-msg hidden" id="completado-msg"></div>
  </section>

  <section class="modulos-grid hidden" id="modulos-grid"></section>

</main>

<footer class="site-footer">
  Ministerio de la Mujer · Asociación Sur Andina (ASA)
</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/modulos-data.js"></script>
<script src="js/modulos.js"></script>
</body>
</html>
